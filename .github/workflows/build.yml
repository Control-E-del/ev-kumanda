name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK'lari derle (tablet + tv)
        run: gradle assembleTabletDebug assembleTvDebug --no-daemon --stacktrace

      - name: APK'lari duzenle
        run: |
          mkdir -p out
          cp app/build/outputs/apk/tablet/debug/*.apk out/EvKumanda-tablet.apk
          cp app/build/outputs/apk/tv/debug/*.apk out/EvKumanda-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ev-kumanda-apk
          path: out/*.apk

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Ev Kumanda v1.1.${{ github.run_number }}
          files: out/*.apk
